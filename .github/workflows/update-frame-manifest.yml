name: Update editor manifests

on:
  push:
    branches: [ main ]
    paths:
      - "frames/**"
      - "layouts/**"
      - "scripts/build_frame_manifest.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frame and layout manifests
        run: python scripts/build_frame_manifest.py

      - name: Commit manifests if changed
        run: |
          if git diff --quiet frames/manifest.json layouts/manifest.json; then
            echo "Manifests already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frames/manifest.json layouts/manifest.json
          git commit -m "Update editor manifests [skip ci]"
          git push
